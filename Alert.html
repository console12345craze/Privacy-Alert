<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Alert</title>
    <style>
        body {
            background-color: #000000; /* Deep black background */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace; /* Tech/Terminal font */
            overflow: hidden;
        }
        h1 {
            font-size: 3.5rem;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 2px 2px #ff0000;
        }
        p {
            font-size: 2rem;
            color: #ff4b2b;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 5px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>Hey, why are you looking at my Chromebook?</h1>
    <p>You better look away</p>
</body>
</html>
